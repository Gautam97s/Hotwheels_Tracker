name: Check Hot Wheels Stock

on:
  schedule:
    # Run every 10 minutes (adjust as needed)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    env:
      # Upstash Redis credentials (set in GitHub Secrets)
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      
      # Telegram credentials (set in GitHub Secrets)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Build TypeScript
        run: |
          cd backend
          npm run build

      - name: Create storage directory
        run: mkdir -p backend/storage

      - name: Fetch config from Upstash Redis
        id: fetch-config
        run: |
          echo "Fetching config from Upstash Redis..."

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $KV_REST_API_TOKEN" \
            "$KV_REST_API_URL/get/hotwheels:tracker:config")

          echo "Raw response: $RESPONSE"

          create_fallback_config() {
            node -e '
              const fs = require("fs");
              const botToken = process.env.TELEGRAM_BOT_TOKEN || "";
              const chatId = process.env.TELEGRAM_CHAT_ID || "";
              const config = {
                products: [{
                  id: "hw-fast-furious-orange",
                  name: "Hot Wheels Premium Fast & Furious Die-Cast Toy Car (Orange)",
                  pincode: "110001",
                  urls: {
                    firstcry: "https://www.firstcry.com/hot-wheels/hot-wheels-premium-fast-and-furious-die-cast-toy-car-for-adult-collectors-orange/21161951/product-detail"
                  },
                  checkIntervalMinutes: 10,
                  notifyOnRestock: true,
                  targetPrice: 199
                }],
                telegram: {
                  botToken,
                  chatId,
                  enabled: Boolean(botToken && chatId)
                },
                defaultPincode: "110001",
                userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                requestTimeout: 15000,
                maxRetries: 2
              };
              fs.writeFileSync("backend/storage/config.json", JSON.stringify(config, null, 2));
              console.log("Fallback config written");
            '
          }

          if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "null" ]; then
            echo "No config found in Upstash, using fallback..."
            create_fallback_config
          else
            CONFIG_VALUE=$(echo "$RESPONSE" | jq -r '.result // empty')

            if [ -z "$CONFIG_VALUE" ] || [ "$CONFIG_VALUE" = "null" ]; then
              echo "Config key not found in Upstash, using fallback..."
              create_fallback_config
            else
              echo "$CONFIG_VALUE" > backend/storage/config.json

              if ! jq empty backend/storage/config.json 2>/dev/null; then
                echo "Invalid JSON from Upstash, using fallback..."
                create_fallback_config
              else
                echo "Config fetched from Upstash Redis successfully"
                cat backend/storage/config.json
              fi
            fi
          fi

      - name: Run stock check
        id: stock-check
        run: |
          cd backend
          npm run check
        continue-on-error: true

      - name: Commit status updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f backend/storage/status.json ]; then
            git add backend/storage/status.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: update stock status [skip ci]"
              git push
            else
              echo "No status changes to commit"
            fi
          fi

      - name: Notify on alert
        if: failure() && steps.stock-check.outcome == 'failure'
        run: |
          echo "🎉 Alert triggered! Check Telegram for details."